<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <meta name="robots" content="noindex, nofollow">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self'; connect-src 'none'; base-uri 'none'; form-action 'none'; object-src 'none'">
  <title>Retorno Shopee · VINILFORTE Ads Manager</title>
  <script src="callback.js"></script>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="card" aria-labelledby="heading">
    <img class="logo" src="logo.svg" alt="VINILFORTE" width="340" height="48">
    <p class="eyebrow">ADS MANAGER · SHOPEE</p>
    <h1 id="heading">Retorno da autorização</h1>
    <p id="status" role="status" aria-live="polite">Esta página recebe o retorno da Shopee. Inicie a autorização pelo VINILFORTE Ads Manager.</p>
    <p id="notice">Esta página não solicita sua senha nem a chave secreta da aplicação. A conexão da loja será concluída no serviço local do gestor.</p>
    <div id="actions" hidden>
      <button id="copy" type="button">Copiar retorno para o gestor</button>
      <button id="clear" class="secondary" type="button">Limpar retorno desta tela</button>
    </div>
    <noscript>Ative o JavaScript para receber o retorno da autorização. Não compartilhe a URL de retorno.</noscript>
    <footer>VINILFORTE · Uso interno</footer>
  </main>
</body>
</html>
